[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equibot"
version = "0.1.0"
description = "Modular AI agents for processing financial reports using PydanticAI and edgartools."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-ai",
    "pydantic-settings",
    "edgartools",
    "openai",
    "python-dotenv",
    "loguru",
    "lancedb>=0.29.2",
    "llama-index>=0.14.15",
    "llama-index-vector-stores-lancedb>=0.4.5",
    "pageindexfork",
    "psycopg[binary]>=3.3.6",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[project.scripts]
equibot = "equibot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/equibot"]

[tool.uv.sources]
pageindexfork = { git = "https://github.com/BenAF002/PageIndexFork.git" }
